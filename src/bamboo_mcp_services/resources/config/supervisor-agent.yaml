# supervisor-agent.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Bamboo MCP Services — Supervisor Agent Configuration
#
# The supervisor starts and monitors all other Bamboo agents.  Run it with:
#
#   bamboo-supervisor --config supervisor-agent.yaml
#
# Or use the bundled default by just running:
#
#   bamboo-supervisor
#
# Each agent entry supports the following keys:
#
#   name            (required) Unique identifier used in logs and health reports.
#   mode            (required) "daemon" — long-running, auto-restarted on exit.
#                              "scheduled" — short-lived --once run on an interval.
#   command         (required) Argument list passed verbatim to the OS.
#   enabled         (optional, default true) Set to false to skip this agent.
#   interval_s      (required for mode=scheduled) Seconds between one-shot runs.
#   depends_on_file (optional) Path that must exist before this agent is started.
#   depends_timeout_s (optional, default 120) Seconds to wait for depends_on_file.
#   run_timeout_s   (optional) Kill scheduled one-shots that exceed this duration.
#                              Defaults to interval_s * 2 (minimum 60s).
#
# ─────────────────────────────────────────────────────────────────────────────

# How often the supervisor polls daemon health and dispatches scheduled jobs.
health_poll_interval_s: 30

# Seconds to wait for child processes to exit after SIGTERM before SIGKILL.
stop_timeout_s: 30

# Supervisor's own rotating log file.
# The --log-file CLI flag overrides this value.
log_file: supervisor-agent.log
log_level: INFO

agents:

  # ── cric-agent ──────────────────────────────────────────────────────────────
  # Reads ATLAS queue metadata from CVMFS and stores it in cric.duckdb.
  # Runs as a long-lived daemon; re-reads the CVMFS file every 10 minutes.
  # The ingestion agent depends on this file, so cric is started first.
  - name: cric
    enabled: true
    mode: daemon
    command:
      - bamboo-cric
      - --config
      - src/bamboo_mcp_services/resources/config/cric-agent.yaml
      - --data
      - cric.duckdb
      - --log-file
      - cric-agent.log

  # ── ingestion-agent ─────────────────────────────────────────────────────────
  # Downloads job metadata from BigPanda for all ATLAS queues; stores results
  # in jobs.duckdb.  Consumes the CRIC queue list from cric.duckdb.
  # Waits up to 120 s for cric.duckdb to appear before starting.
  - name: ingestion
    enabled: true
    mode: daemon
    depends_on_file: cric.duckdb
    depends_timeout_s: 120
    command:
      - bamboo-ingestion
      - --config
      - src/bamboo_mcp_services/resources/config/ingestion-agent.yaml
      - --log-file
      - ingestion-agent.log

  # ── github-doc-sync-agent ───────────────────────────────────────────────────
  # Polls configured GitHub repositories for documentation changes and writes
  # normalised Markdown to the local data directory for RAG ingestion.
  # Run as a scheduled one-shot every hour.
  - name: github-sync
    enabled: true
    mode: scheduled
    interval_s: 3600
    command:
      - bamboo-github-sync
      - --config
      - src/bamboo_mcp_services/resources/config/github-doc-sync-agent.yaml
      - --once
      - --log-file
      - github-doc-sync-agent.log

  # ── document-monitor-agent ──────────────────────────────────────────────────
  # Monitors per-collection normalised documentation directories for new or
  # changed files and ingests them into the corresponding ChromaDB collections.
  # Each --watch DIR COLLECTION pair maps one normalised output directory
  # (written by github-sync) to the logical ChromaDB collection name.
  # Directories must match the normalized_destination values in
  # github-doc-sync-agent.yaml.  Run as a scheduled one-shot every 10 minutes
  # so ChromaDB stays fresh after each github-sync run.
  #
  # --model-path must point to the locally cached all-MiniLM-L6-v2 model.
  # When this flag is set, a load failure causes the agent to exit immediately
  # rather than silently using a DummyEmbedder and corrupting ChromaDB with
  # zero-vector embeddings.  Update the path to match your local model cache.
  - name: document-monitor
    enabled: true
    mode: scheduled
    interval_s: 600
    command:
      - bamboo-document-monitor
      - --watch
      - /data/bamboo/rag/panda_docs
      - panda_docs
      - --watch
      - /data/bamboo/rag/atlas_docs
      - atlas_docs
      - --watch
      - /data/bamboo/rag/bamboo_docs
      - bamboo_docs
      - --watch
      - /data/bamboo/rag/rucio_docs
      - rucio_docs
      - --watch
      - /data/bamboo/rag/root_docs
      - root_docs
      - --model-path
      - /data/models/sentence-transformers/all-MiniLM-L6-v2
      - --chroma-dir
      - .chromadb
      - --once
      - --log-file
      - document-monitor-agent.log

  # ── core-reaper ─────────────────────────────────────────────────────────────
  # Reports reclaimable PanDA core-dump analysis workspaces under
  # $BAMBOO_CORE_ANALYSIS_ROOT (default /tmp/bamboo/core-analysis).  Core dumps
  # are routinely 1 GB each and Bamboo MCP never deletes them, so an unattended
  # node fills up until someone clears the directory by hand.
  #
  # This build REMOVES NOTHING.  It logs "I could have removed: <path>" for
  # every workspace that passes the safety rules and the path guard, so the
  # decisions can be reviewed against real production data before any deletion
  # code is written.  There is no --apply flag to enable.
  #
  # Runs as a scheduled one-shot every hour; a sweep is read-only and cheap.
  - name: core-reaper
    enabled: true
    mode: scheduled
    interval_s: 3600
    command:
      - bamboo-core-reaper
      - --config
      - src/bamboo_mcp_services/resources/config/core-reaper-agent.yaml
      - --once
      - --log-file
      - core-reaper-agent.log
