[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bamboo-mcp-services"
version = "1.0.0"
description = "Bamboo MCP Services"
requires-python = ">=3.10"
dependencies = [
    # duckdb and chromadb write files that bamboo-mcp reads, so their on-disk
    # formats must match the versions bamboo-mcp runs.  The exact pins live in
    # requirements/runtime-py312.txt (S-21); these ranges stop an unpinned
    # install from crossing a minor version by accident.
    "duckdb>=1.5,<1.6",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pandas>=2.0",
    # Embeddings stack — versions pinned for PyTorch 2.2.x compatibility.
    # torch 2.4+ is not available on macOS/miniforge with Python 3.12;
    # sentence-transformers 3.x and transformers 4.41+ require torch>=2.4
    # and will fail at import time.  numpy<2 is required because torch 2.2.x
    # was compiled against the NumPy 1.x ABI.
    "numpy<2",
    "torch==2.2.2",
    "transformers==4.40.0",
    "sentence-transformers==2.7.0",
    "langchain-huggingface>=1.2",
    "langchain-community>=0.4",
    # Agent dependencies
    "chromadb>=1.5,<1.6",
    "pdfminer.six>=20221105",
    "python-docx>=0.8.11",
    # Dashboard agent
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "pytest",
    "pytest-cov",
    # tests/test_packaging.py builds a wheel in-process; setuptools 70.1 is
    # the first with bdist_wheel built in, so no separate "wheel" package.
    "setuptools>=70.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python files the package reads at run time.  Without this table the
# built wheel ships none of them, and only an editable install (which reads
# the source tree) has them.  tests/test_packaging.py builds a wheel and
# checks that every file listed here is in it.
[tool.setuptools.package-data]
bamboo_mcp_services = [
    "resources/config/*.yaml",
    "resources/config/*.json",
    "agents/dashboard_agent/static/*.html",
]

[project.scripts]
bamboo-document-monitor = "bamboo_mcp_services.agents.document_monitor_agent.cli:main"
bamboo-github-sync = "bamboo_mcp_services.agents.github_doc_sync_agent.cli:main"
bamboo-ingestion = "bamboo_mcp_services.agents.ingestion_agent.cli:main"
bamboo-cric = "bamboo_mcp_services.agents.cric_agent.cli:main"
bamboo-dummy = "bamboo_mcp_services.agents.dummy_agent.cli:main"
bamboo-supervisor = "bamboo_mcp_services.agents.supervisor_agent.cli:main"
bamboo-dashboard = "bamboo_mcp_services.agents.dashboard_agent.cli:main"
bamboo-core-reaper = "bamboo_mcp_services.agents.core_reaper_agent.cli:main"
